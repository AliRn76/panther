line-length = 120
target-version = "py310"
extend-exclude = ["build"]
force-exclude = true

[lint]
select = [
    "E4", # pycodestyle import errors
    "E7", # pycodestyle statement and comparison errors
    "E9", # pycodestyle runtime errors
    "F", # Pyflakes undefined names and unused code
    "I", # isort import ordering
]
ignore = [
    "E501", # line length; Ruff's formatter is the source of truth
]

[lint.isort]
known-first-party = ["panther"]

[lint.per-file-ignores]
"**/__init__.py" = ["F401"] # package modules commonly re-export public names

[format]
quote-style = "single"
