[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "panther-server"
description = "Rust (hyper + tokio) ASGI web server for the Panther framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Panther Contributors" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/AliRn76/panther"
Issues = "https://github.com/AliRn76/panther/issues"

[tool.maturin]
module-name = "panther_server._panther_server"
python-source = "python"
features = ["pyo3/extension-module"]
