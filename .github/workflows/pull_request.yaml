name: Pull Request

on:
  pull_request:
    types: [ opened, synchronize ]

jobs:

  tests-linux:
    name: Test Linux
    runs-on: ubuntu-latest

    services:
      postgresql:
        image: postgres:16
        env:
          POSTGRES_DB: panther_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d panther_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PANTHER_POSTGRES_TEST_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/panther_test

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: '4.4'

      - name: Remove Build Directory
        run: rm -rf build/

      - name: Run Tests
        run: coverage run tests

      - name: Show Coverage
        run: coverage report

  rust-server:
    name: Rust Web Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check Formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --check

      - name: Lint
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt maturin

      - name: Build The Extension
        run: |
          maturin build --release -m rust/Cargo.toml --out dist
          pip install --find-links dist --no-index panther-server

      - name: Run Tests
        run: python -m pytest tests/test_rust_server.py -v

  tests-windows:
    name: Test Windows
    runs-on: windows-latest
    needs: [ tests-linux ]

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: python tests --not_mongodb --not_slow --not_postgresql

  tests-macos:
    name: Test MacOS
    runs-on: macos-latest
    needs: [ tests-linux ]

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: python tests --not_mongodb --not_slow --not_postgresql
